services:
  webhook_tunnel_server:
    image: node:22-alpine
    container_name: webhook_tunnel_server
    working_dir: /home/node/app
    volumes:
      - .:/home/node/app
    ports:
      - "8080:80"
    command: sh -c "npm install && npm start"

  webhook_tunnel_client:
    image: node:22-alpine
    container_name: webhook_tunnel_client
    working_dir: /home/node/app
    volumes:
      - .:/home/node/app
    depends_on:
      - webhook_tunnel_server
    command: sh -c "npm install && npm run client http://webhook_tunnel_server"
