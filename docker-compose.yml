services:
  webhook_tunnel_server:
    image: node:22-alpine
    container_name: webhook_tunnel_server
    working_dir: /home/node/app
    volumes:
      - .:/home/node/app
    ports:
      - "5555:5555"
    env_file:
      - .env
    command: sh -c "npm install && npm run server"

  webhook_tunnel_client:
    image: node:22-alpine
    container_name: webhook_tunnel_client
    working_dir: /home/node/app
    volumes:
      - .:/home/node/app
    depends_on:
      - webhook_tunnel_server
    env_file:
      - .env
    command: sh -c "npm install && npm run client"
